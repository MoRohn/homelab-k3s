# MinIO runs outside the cluster (bnn Docker stack, see docs/minio.md).
# Token: secret monitoring/minio-prometheus, created by scripts/install-monitoring.sh
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: minio-cluster
spec:
  jobName: minio
  metricsPath: /minio/v2/metrics/cluster
  scrapeInterval: 60s
  authorization:
    credentials: {name: minio-prometheus, key: token}
  staticConfigs:
    - targets: ["192.168.68.72:9000"]
      labels: {instance: bnn-minio}
  metricRelabelings:
    # Keep capacity, health, S3 traffic and error metrics; drop the rest
    - sourceLabels: [__name__]
      regex: minio_(cluster_(capacity|nodes|health|drive|usage)_.*|s3_(requests|traffic|time)_.*|node_(process_uptime|file_descriptor)_.*|inter_node_.*_errors_total)
      action: keep
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: minio-bucket
spec:
  jobName: minio-bucket
  metricsPath: /minio/v2/metrics/bucket
  scrapeInterval: 120s
  authorization:
    credentials: {name: minio-prometheus, key: token}
  staticConfigs:
    - targets: ["192.168.68.72:9000"]
      labels: {instance: bnn-minio}
  metricRelabelings:
    - sourceLabels: [__name__]
      regex: minio_bucket_(usage_(total_bytes|object_total)|traffic_.*_bytes)
      action: keep
