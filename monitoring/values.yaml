# kube-prometheus-stack Helm values — chart prometheus-community/kube-prometheus-stack 91.8.2
# Deployed by Argo CD: argocd/apps/monitoring.yaml
#
# Profile: lean and capped. This box shares unified memory with resident model servers
# (see bnn gpusched), so every component has a hard memory limit.

crds:
  enabled: true

# ---- k3s runs these inside its own process; scraping them only yields "down" targets ----
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeEtcd: {enabled: false}
kubeProxy: {enabled: false}
windowsMonitoring: {enabled: false}

defaultRules:
  create: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    windows: false
    alertmanager: false

# ---- Alerts show on dashboards; nothing pushes notifications, so no Alertmanager ----
alertmanager:
  enabled: false

prometheusOperator:
  resources:
    requests: {cpu: 20m, memory: 48Mi}
    limits: {memory: 128Mi}
  prometheusConfigReloader:
    resources:
      requests: {cpu: 5m, memory: 16Mi}
      limits: {memory: 48Mi}

prometheus:
  prometheusSpec:
    scrapeInterval: 30s
    evaluationInterval: 30s
    retention: 7d
    retentionSize: 8GB
    # Pick up every ServiceMonitor/PodMonitor/rule in the cluster, not just this release's
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 100m, memory: 384Mi}
      limits: {memory: 900Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 10Gi}

kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 48Mi}
    limits: {memory: 128Mi}

prometheus-node-exporter:
  resources:
    requests: {cpu: 10m, memory: 24Mi}
    limits: {memory: 64Mi}

grafana:
  # Credentials come from a Secret created by scripts/install-monitoring.sh (not in git)
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Dashboards and datasources are code; nothing worth persisting
  persistence:
    enabled: false
  # The chart's stock dashboards are replaced by the curated set in monitoring/dashboards/
  defaultDashboardsEnabled: false
  defaultDashboardsTimezone: browser
  resources:
    requests: {cpu: 20m, memory: 96Mi}
    limits: {memory: 256Mi}
  sidecar:
    resources:
      requests: {cpu: 5m, memory: 48Mi}
      limits: {memory: 96Mi}
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  grafana.ini:
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
    users:
      allow_sign_up: false
      default_theme: dark
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/Homelab/homelab-overview.json
    news:
      news_feed_enabled: false
  service:
    type: ClusterIP
  testFramework:
    enabled: false
