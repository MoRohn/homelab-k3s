# kube-prometheus-stack Helm values — chart prometheus-community/kube-prometheus-stack 91.8.2
# Deployed by Argo CD: argocd/apps/monitoring.yaml
#
# Profile: lean and capped. This box shares unified memory with resident model servers
# (see bnn gpusched), so every component has a hard memory limit.

crds:
  enabled: true

# ---- k3s runs these inside its own process; scraping them only yields "down" targets ----
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeEtcd: {enabled: false}
kubeProxy: {enabled: false}
windowsMonitoring: {enabled: false}

defaultRules:
  create: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    windows: false
    alertmanager: false
    # Multi-window SLO burn-rate rules need the API-server histograms dropped below
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
  disabled:
    # No Alertmanager on purpose
    PrometheusNotConnectedToAlertmanagers: true
    # This box runs >90% memory used by design (resident models); replaced by
    # the MemAvailable-based rules in monitoring/extras/homelab-rules.yaml
    NodeMemoryHighUtilization: true

# ---- Cardinality: k3s runs the API server, etcd and scheduler inside the kubelet
# process, so the kubelet's /metrics repeats all of their series. Drop them there,
# and drop the API server's latency histograms (~50k series nothing here uses). ----
kubelet:
  serviceMonitor:
    metricRelabelings:
      # Chart default: reduce kubelet storage-operation bucket cardinality
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      # Control-plane series duplicated from the k3s process
      - action: drop
        sourceLabels: [__name__]
        regex: (apiserver|etcd|scheduler|workqueue|apiextensions|aggregator|authentication|authenticated|authorization|field_validation|watch_cache|kube_apiserver|admission|flowcontrol|cardinality_enforcement|pod_security|serviceaccount|endpoint_slice|endpoint_slice_controller|endpoint_slice_mirroring_controller|replicaset_controller|garbagecollector|job_controller|cronjob_controller|node_collector|ttl_after_finished_controller|ephemeral_volume_controller|attachdetach_controller|service_controller|root_ca_cert_publisher|leader_election|node_ipam_controller|rest_client)_.+

kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      # Keep only what the enabled alert rules use (~16k series -> ~2k)
      - action: keep
        sourceLabels: [__name__]
        regex: (aggregator_unavailable_apiservice(_total)?|apiserver_client_certificate_expiration_seconds_(bucket|count)|apiserver_request_terminations_total|apiserver_request_total|apiserver_current_inflight_requests|apiserver_storage_objects|kubernetes_build_info|process_(cpu_seconds_total|max_fds|open_fds|resident_memory_bytes|virtual_memory_bytes|virtual_memory_max_bytes)|rest_client_requests_total)

# ---- Alerts show on dashboards; nothing pushes notifications, so no Alertmanager ----
alertmanager:
  enabled: false

prometheusOperator:
  resources:
    requests: {cpu: 20m, memory: 48Mi}
    limits: {memory: 128Mi}
  prometheusConfigReloader:
    resources:
      requests: {cpu: 5m, memory: 16Mi}
      limits: {memory: 48Mi}

prometheus:
  prometheusSpec:
    scrapeInterval: 30s
    evaluationInterval: 30s
    retention: 7d
    retentionSize: 8GB
    # Pick up every ServiceMonitor/PodMonitor/rule in the cluster, not just this release's
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 100m, memory: 384Mi}
      limits: {memory: 900Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 10Gi}

kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 48Mi}
    limits: {memory: 128Mi}

prometheus-node-exporter:
  extraArgs:
    # Chart defaults (setting extraArgs replaces them)
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    # GB10 uses cppc_cpufreq: reading frequencies goes through ACPI CPPC firmware calls
    # that block ~22% of the time, hanging the whole scrape (bisected 2026-10-01).
    - --no-collector.cpufreq
    # Off-site backup freshness (backup/offsite-sync.sh). /var/tmp: readable by node-exporter's
    # unprivileged user, writable without sudo, survives reboots.
    - --collector.textfile.directory=/host/root/var/tmp/node_exporter_textfile
  # 64Mi was OOM-killed ~40 times a day here (many interfaces, NVMe, hwmon); it peaks ~60Mi
  resources:
    requests: {cpu: 10m, memory: 48Mi}
    limits: {memory: 128Mi}

grafana:
  # Credentials come from a Secret created by scripts/install-monitoring.sh (not in git)
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Dashboards and datasources are code; nothing worth persisting
  persistence:
    enabled: false
  # The chart's stock dashboards are replaced by the curated set in monitoring/dashboards/
  defaultDashboardsEnabled: false
  defaultDashboardsTimezone: browser
  # Grafana 13 idles ~300Mi and peaks ~480Mi rendering the overview; GOMEMLIMIT makes the
  # Go GC work harder before the cap
  resources:
    requests: {cpu: 20m, memory: 256Mi}
    limits: {memory: 640Mi}
  env:
    GOMEMLIMIT: 480MiB
  # Grafana's own metrics (~5.5k series) aren't charted anywhere
  serviceMonitor:
    enabled: false

  # No sidecars (~150Mi saved): datasource and dashboards are mounted directly.
  # Mounted ConfigMaps still update in place, and Grafana rescans them.
  sidecar:
    dashboards: {enabled: false}
    datasources: {enabled: false}
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://monitoring-kube-prometheus-prometheus.monitoring:9090/
          isDefault: true
          jsonData: {timeInterval: 30s}
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - {name: homelab, folder: Homelab, type: file, allowUiUpdates: false, updateIntervalSeconds: 30,
           options: {path: /var/lib/grafana/dashboards/homelab}}
        - {name: node, folder: Node, type: file, allowUiUpdates: false, updateIntervalSeconds: 30,
           options: {path: /var/lib/grafana/dashboards/node}}
        - {name: kubernetes, folder: Kubernetes, type: file, allowUiUpdates: false, updateIntervalSeconds: 30,
           options: {path: /var/lib/grafana/dashboards/kubernetes}}
        - {name: storage, folder: Storage, type: file, allowUiUpdates: false, updateIntervalSeconds: 30,
           options: {path: /var/lib/grafana/dashboards/storage}}
  # ConfigMaps generated by monitoring/kustomization.yaml
  dashboardsConfigMaps:
    homelab: dashboards-homelab
    node: dashboards-node
    kubernetes: dashboards-kubernetes
    storage: dashboards-storage
  grafana.ini:
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
    users:
      allow_sign_up: false
      default_theme: dark
    dashboards:
      default_home_dashboard_path: /var/lib/grafana/dashboards/homelab/homelab-overview.json
    news:
      news_feed_enabled: false
    plugins:
      preinstall_disabled: true
    log:
      level: warn
  service:
    type: ClusterIP
  testFramework:
    enabled: false
