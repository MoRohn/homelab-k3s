# Builds the Labzilla tray app (lif/apps/tray) for macOS, Windows and Linux.
# Runs on demand, on tags `tray-v*`, and on pull requests that touch the app. Builds are unsigned:
# macOS Gatekeeper and Windows SmartScreen will warn until signing identities are added as secrets.
name: tray

on:
  workflow_dispatch:
  push:
    tags: ["tray-v*"]
  pull_request:
    paths: ["lif/apps/tray/**", ".github/workflows/tray.yml"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, args: "--target universal-apple-darwin", targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
          - { os: windows-latest, args: "", targets: "" }
          - { os: ubuntu-24.04, args: "", targets: "" }
          - { os: ubuntu-24.04-arm, args: "", targets: "" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: lif/apps/tray
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: lif/apps/tray/src-tauri -> target
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: labzilla-tray-${{ matrix.os }}
          if-no-files-found: error
          path: |
            lif/apps/tray/src-tauri/target/**/release/bundle/dmg/*.dmg
            lif/apps/tray/src-tauri/target/**/release/bundle/msi/*.msi
            lif/apps/tray/src-tauri/target/**/release/bundle/nsis/*.exe
            lif/apps/tray/src-tauri/target/**/release/bundle/deb/*.deb
            lif/apps/tray/src-tauri/target/**/release/bundle/rpm/*.rpm
            lif/apps/tray/src-tauri/target/**/release/bundle/appimage/*.AppImage
