# kube-prometheus-stack: chart from prometheus-community, values from this repo
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 91.8.2
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/monitoring/values.yaml
    - repoURL: https://github.com/MoRohn/homelab-k3s.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions:
      - CreateNamespace=true
      # The operator's CRDs exceed the client-side apply annotation limit
      - ServerSideApply=true
