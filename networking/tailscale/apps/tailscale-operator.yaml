# Applied by scripts/install-tailscale.sh once the OAuth secret exists (the operator can't
# start without it). Managed by Argo CD from git after that.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      targetRevision: 1.102.4
      helm:
        releaseName: tailscale-operator
        valueFiles:
          - $values/networking/tailscale/values.yaml
    - repoURL: https://github.com/MoRohn/homelab-k3s.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
