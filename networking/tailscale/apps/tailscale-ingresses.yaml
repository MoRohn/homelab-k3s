# Tailnet-only HTTPS for Grafana and Prometheus (networking/tailscale/ingresses)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-ingresses
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MoRohn/homelab-k3s.git
    targetRevision: main
    path: networking/tailscale/ingresses
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [SkipDryRunOnMissingResource=true]   # ProxyClass CRD comes with the operator
    retry:
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
