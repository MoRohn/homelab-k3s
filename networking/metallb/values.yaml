# MetalLB Helm values — chart metallb/metallb 0.16.1 (Argo CD: argocd/apps/metallb.yaml)
# Layer 2 mode only: no BGP, so no FRR. Single node, so no memberlist.
frrk8s:
  enabled: false
speaker:
  frr:
    enabled: false
  memberlist:
    enabled: false
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 96Mi}
controller:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 96Mi}
prometheus:
  serviceMonitor:
    enabled: false
