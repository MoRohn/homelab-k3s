# Completion detection (spec §42). Never closes a workflow alone: the agent loop also
# requires every deterministic acceptance check to pass (spec §43).
name: goal-satisfied
version: v1
primitive: choice
stage: designed
risk: medium
reversible: true
owner: agent-core
data_class: CONFIDENTIAL
instructions: >
  Judge the status of the goal in `goal.text` from `progress.artifacts`,
  `progress.checks`, `progress.remaining_requirements` and `progress.last_result_summary`.
criteria:
  done: every requirement of `goal.text` is met by an item in `progress.artifacts`, `progress.remaining_requirements` is empty, and `progress.checks` lists no failing check
  not_done: at least one requirement of `goal.text` is still open and `progress.last_result_summary` shows no obstacle that stops the agent from working on it
  blocked: an open requirement needs something the agent cannot obtain itself, such as a missing permission, a human answer or a service that `progress.last_result_summary` reports as unavailable
  uncertain: the state does not show whether the open requirements of `goal.text` are met
exits: [uncertain]
state_schema:
  goal.text: str
  progress.artifacts: list
  progress.checks: list
  progress.remaining_requirements: list
  progress.last_result_summary: str
default: uncertain
fallback: [rules, local_llm]
policy:
  mode: three_zone
  middle_route: [local_reasoning, kimi]
  low_route: [safe_default]
