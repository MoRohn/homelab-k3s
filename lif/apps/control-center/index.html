<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIF Control Center</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--panel2:#f0f2f5;--text:#16191d;--muted:#5b6470;--border:#dde1e6;
  --accent:#2f5bd3;--accent-ink:#ffffff;--ok:#1f7a3f;--ok-bg:#e3f4e8;--warn:#8a5a00;--warn-bg:#fdf1d8;
  --bad:#b3261e;--bad-bg:#fbe4e2;--info:#1d5c8f;--info-bg:#e1eef9;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;--radius:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1216;--panel:#171b21;--panel2:#1e232b;--text:#e6e9ee;--muted:#9aa4b2;--border:#2a313b;
    --accent:#7c9cff;--accent-ink:#0b1020;--ok:#6fd38f;--ok-bg:#17301f;--warn:#f1c25b;--warn-bg:#352a12;
    --bad:#ff8a80;--bad-bg:#3a1a18;--info:#8cc4f2;--info-bg:#15283a;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1216;--panel:#171b21;--panel2:#1e232b;--text:#e6e9ee;--muted:#9aa4b2;--border:#2a313b;
  --accent:#7c9cff;--accent-ink:#0b1020;--ok:#6fd38f;--ok-bg:#17301f;--warn:#f1c25b;--warn-bg:#352a12;
  --bad:#ff8a80;--bad-bg:#3a1a18;--info:#8cc4f2;--info-bg:#15283a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--sans)}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--border);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav .brand{font-weight:700;letter-spacing:.04em;font-size:12px;color:var(--muted);padding:4px 8px 12px}
nav .brand b{display:block;color:var(--text);font-size:15px;letter-spacing:0}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:7px 10px;border-radius:6px;font:inherit;cursor:pointer}
nav button:hover{background:var(--panel2)}
nav button.active{background:var(--accent);color:var(--accent-ink)}
nav .foot{margin-top:16px;padding:8px;font-size:12px;color:var(--muted)}
main{padding:18px 22px;min-width:0}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header.top h1{font-size:18px;margin:0;flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;min-width:0}
.card h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.big{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)}.warn{background:var(--warn-bg);color:var(--warn)}
.bad{background:var(--bad-bg);color:var(--bad)}.info{background:var(--info-bg);color:var(--info)}
.neutral{background:var(--panel2);color:var(--muted)}
section{margin-bottom:18px}
section>h2{font-size:14px;margin:0 0 8px}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--panel2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
code,.mono{font-family:var(--mono);font-size:12px}
.btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:6px;font:inherit;font-size:12px;cursor:pointer;margin:1px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}
.btn.danger{color:var(--bad)}
.btn.hero{font-size:15px;padding:10px 18px;letter-spacing:.03em}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.funnel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.funnel span.step{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-variant-numeric:tabular-nums}
.funnel span.arrow{color:var(--muted)}
.toast{position:fixed;right:16px;bottom:16px;max-width:460px;padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel);box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:9}
.inspector{position:fixed;top:0;right:0;width:min(520px,100%);height:100vh;overflow:auto;background:var(--panel);border-left:1px solid var(--border);padding:16px;z-index:8;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);gap:12px}
.toggle:last-child{border-bottom:0}
input[type=number],select,input[type=text]{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font:inherit}
.empty{padding:18px;text-align:center;color:var(--muted)}
.timeline li{list-style:none;padding:6px 0;border-bottom:1px solid var(--border);display:grid;grid-template-columns:120px 170px 1fr;gap:10px}
.timeline{padding:0;margin:0}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  nav{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;padding:8px;border-right:0;border-bottom:1px solid var(--border)}
  nav .brand,nav .foot{display:none}
  nav button{width:auto;white-space:nowrap}
  main{padding:12px 16px}
  .timeline li{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <nav id="nav" aria-label="Sections">
    <div class="brand">LOCAL INTELLIGENCE<b>Fabric Control Center</b></div>
    <div id="navbtns"></div>
    <div class="foot">
      <button class="btn" id="themeBtn" type="button">Theme</button>
      <button class="btn" id="signout" type="button">Sign out</button>
      <div id="lastRefresh" style="margin-top:8px"></div>
    </div>
  </nav>
  <main>
    <header class="top"><h1 id="title">Overview</h1><span id="hdrState"></span></header>
    <div id="view"><div class="empty">Loading…</div></div>
  </main>
</div>
<div id="overlay"></div>
<script>
"use strict";
// ── safe HTML: every interpolation is escaped unless wrapped in raw() ─────────
const ESC = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
function esc(v){ return String(v === null || v === undefined ? "" : v).replace(/[&<>"']/g, c => ESC[c]); }
class Raw { constructor(s){ this.s = s; } toString(){ return this.s; } }
function raw(s){ return new Raw(String(s)); }
function html(strings, ...vals){
  let out = strings[0];
  vals.forEach((v, i) => {
    if (v instanceof Raw) out += v.s;
    else if (Array.isArray(v)) out += v.map(x => x instanceof Raw ? x.s : esc(x)).join("");
    else out += esc(v);
    out += strings[i + 1];
  });
  return raw(out);
}
function setHTML(el, r){ el.innerHTML = (r instanceof Raw) ? r.s : esc(r); }   // the ONLY innerHTML sink

// ── storage / auth ───────────────────────────────────────────────────────────
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){} }
let KEY = lsGet("lif.adminKey");
function askKey(){
  const k = window.prompt("LIF admin key (Secret lif-admin-keys):", "");
  if (k){ KEY = k.trim(); lsSet("lif.adminKey", KEY); }
  return !!k;
}
async function api(method, path, body){
  if (!KEY && !askKey()) throw new Error("admin key required");
  const r = await fetch(path, {method, headers: {"Authorization": "Bearer " + KEY, "Content-Type": "application/json"},
                               body: body === undefined ? undefined : JSON.stringify(body)});
  let data = {};
  try { data = await r.json(); } catch(e){}
  if (r.status === 401){ KEY = null; lsSet("lif.adminKey", null); if (askKey()) return api(method, path, body); }
  if (!r.ok){ const m = (data && (data.error && (data.error.message || data.error))) || r.statusText; throw new Error(typeof m === "string" ? m : JSON.stringify(m)); }
  return data;
}
function toast(msg, cls){
  const d = document.createElement("div");
  d.className = "toast " + (cls || "");
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 6000);
}

// ── formatting ───────────────────────────────────────────────────────────────
const fmt = {
  n(v, d){ if (v === null || v === undefined || v === "" || isNaN(v)) return "–"; return Number(v).toLocaleString(undefined, {maximumFractionDigits: d === undefined ? 1 : d}); },
  pct(v){ return (v === null || v === undefined || isNaN(v)) ? "–" : (Number(v) * 100).toFixed(1) + "%"; },
  mib(v){ return (v === null || v === undefined) ? "–" : (Number(v) >= 1024 ? (Number(v) / 1024).toFixed(1) + " GiB" : Number(v).toFixed(0) + " MiB"); },
  bytes(v){ if (!v) return "0"; const g = v / 2**30; return g >= 1 ? g.toFixed(1) + " GiB" : (v / 2**20).toFixed(0) + " MiB"; },
  ts(t){ if (!t) return "–"; const d = new Date(Number(t) * 1000); return d.toLocaleString(undefined, {month:"short", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit"}); },
  ago(t){ if (!t) return "–"; const s = Date.now()/1000 - Number(t); if (s < 90) return Math.round(s) + "s ago"; if (s < 5400) return Math.round(s/60) + "m ago"; if (s < 129600) return Math.round(s/3600) + "h ago"; return Math.round(s/86400) + "d ago"; },
};
const STATE_CLASS = {LOW:"ok", MODERATE:"info", HIGH:"warn", IMMINENT:"bad"};
const MODEL_STATE_CLASS = {PRODUCTION:"ok", CANARY:"info", APPROVED:"info", STANDBY:"neutral", CANDIDATE:"warn",
  STAGED:"neutral", DOWNLOADING:"info", VALIDATING:"info", BENCHMARKING:"info", DISCOVERED:"neutral",
  DEPRECATED:"neutral", QUARANTINED:"bad", REJECTED:"bad", FAILED:"bad"};
function pill(text, cls){ return html`<span class="pill ${raw(esc(cls || "neutral"))}">${text}</span>`; }
function yesno(b, yes, no){ return b ? pill(yes || "READY", "ok") : pill(no || "UNAVAILABLE", "bad"); }
function kv(pairs){ return html`<dl class="kv">${pairs.map(([k, v]) => html`<dt>${k}</dt><dd>${v}</dd>`)}</dl>`; }
function card(title, body){ return html`<div class="card"><h3>${title}</h3>${body}</div>`; }
function tbl(headers, rows, opts){
  opts = opts || {};
  if (!rows.length) return html`<div class="tablewrap"><div class="empty">${opts.empty || "Nothing to show."}</div></div>`;
  return html`<div class="tablewrap"><table><thead><tr>${headers.map(h => html`<th>${h}</th>`)}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ── pages ────────────────────────────────────────────────────────────────────
const PAGES = ["Overview","Models","Discovery","Deployments","Inference","Decision Fabric","Batch Jobs","GPU",
               "Benchmarks","Registry","Savings","Settings","Decision Engineering",
               "Knowledge","Decisions","Evidence","Reconsiderations","Diagnostics","Agent Work","Skills & Packages"];
let current = lsGet("lif.page") || "Overview";
if (!PAGES.includes(current)) current = "Overview";
let cache = {};
let inspectorRec = null;

function navRender(){
  setHTML(document.getElementById("navbtns"),
    html`${PAGES.map(p => html`<button type="button" data-page="${p}" class="${raw(p === current ? "active" : "")}">${p}</button>`)}`);
}
document.getElementById("navbtns").addEventListener("click", e => {
  const b = e.target.closest("button[data-page]");
  if (!b) return;
  current = b.dataset.page; lsSet("lif.page", current); navRender(); refresh();
});

async function loadOverview(){ cache.overview = await api("GET", "/v1/overview"); return cache.overview; }

function headerState(o){
  const b = (o && o.blerbz) || {};
  setHTML(document.getElementById("hdrState"),
    html`Primary workload ${pill(b.state || "?", STATE_CLASS[b.state])} <span class="muted small">${b.reason || ""}</span>`);
}

function availRows(av7, av24){
  const caps = ["gateway","fast_model","default_model","embedding","decision_fabric","useful_local_ai"];
  return caps.map(c => {
    const a = (av24 || {})[c], b = (av7 || {})[c];
    return html`<tr><td>${c}</td><td class="num">${a ? fmt.pct(a.availability) : "–"}</td><td class="num">${a ? fmt.n(a.samples, 0) : "0"}</td>
      <td class="num">${b ? fmt.pct(b.availability) : "–"}</td><td class="num">${b ? fmt.n(b.samples, 0) : "0"}</td>
      <td class="num">${a && a.mean_latency_ms ? fmt.n(a.mean_latency_ms, 0) + " ms" : "–"}</td></tr>`;
  });
}

async function pageOverview(){
  const o = await loadOverview();
  const caps = (o.capabilities && o.capabilities.aliases) || {};
  const b = o.blerbz || {}; const df = o.decision_fabric || {}; const bt = o.batch || {};
  const useful = (caps["local/fast"] || {}).available || (caps["local/default"] || {}).available;
  const mainAliases = ["local/fast","local/default","local/reasoning","local/code","local/embedding","local/vision","local/rerank"];
  return html`
  <div class="grid">
    ${card("System", html`<div class="big">${useful ? pill("HEALTHY","ok") : pill("DEGRADED","bad")}</div>
      ${kv([["Gateway", (o.capabilities && !o.capabilities.error) ? pill("READY","ok") : pill("UNREACHABLE","bad")],
            ["Decision Fabric", df.error ? pill("UNREACHABLE","bad") : (df.jev_enabled && !df.jev_breaker_open ? pill("JEV READY","ok") : pill("RULES ONLY","warn"))],
            ["Controller uptime", fmt.n((o.controller_uptime_sec || 0) / 3600, 1) + " h"]])}`)}
    ${card("Primary workload", html`<div class="big">${pill(b.state || "?", STATE_CLASS[b.state])}</div>
      ${kv([["Reason", b.reason || "–"], ["P(prod. in 1h)", fmt.pct(b.p_next_hour)], ["Production leases", fmt.n(b.production_leases, 0)]])}`)}
    ${card("Unified memory", html`${kv([["MemAvailable", fmt.mib(b.mem_available_mib)], ["GPU admissible", fmt.mib(b.admissible_mib)],
            ["GPU util", fmt.n(b.gpu_util_percent) + "%"]])}`)}
    ${card("Batch", html`${kv([["Paused", bt.error ? "–" : (bt.paused ? pill("PAUSED","warn") : pill("RUNNING","ok"))],
            ["Queued", fmt.n(bt.queued !== undefined ? bt.queued : bt.queue_depth, 0)], ["Running", fmt.n(bt.running, 0)]])}`)}
    ${card("Decision Fabric", html`${kv([["Decisions", fmt.n(df.decisions_total, 0)], ["Median latency", df.latency_ms_p50 !== undefined ? fmt.n(df.latency_ms_p50, 0) + " ms" : "–"],
            ["Cache hit", fmt.pct(df.cache_hit_rate)], ["Jev model", df.jev_model || "–"]])}`)}
    ${card("Model registry", html`${kv(Object.entries(o.models || {}).map(([k, v]) => [k, fmt.n(v, 0)]))}`)}
  </div>
  <section style="margin-top:16px"><h2>Logical models</h2>
  ${tbl(["Alias","Status","Served by","Notes"], mainAliases.map(a => { const v = caps[a] || {};
      return html`<tr><td class="mono">${a}</td><td>${yesno(v.available, v.degraded ? "DEGRADED" : (v.fallback ? "FALLBACK" : "READY"))}</td>
      <td class="mono">${v.served_by || "–"}</td><td class="small muted">${v.reason || ""}</td></tr>`; }))}
  </section>
  <section><h2>Availability <span class="muted small">— measured by synthetic inference probes every 30 s; no SLO is claimed without samples</span></h2>
  ${tbl(["Capability","24 h","samples","7 d","samples","mean probe latency"], availRows(o.availability_7d, o.availability_24h))}
  </section>`;
}

async function pageModels(){
  const d = await api("GET", "/v1/models");
  const rows = (d.models || []).map(m => {
    const p = m.profile || {}; const s = (m.last_benchmark && m.last_benchmark.summary) || {};
    return html`<tr>
      <td><div class="mono">${m.id}</div><div class="small muted">${m.model_id}@${String(m.revision || "").slice(0, 10)}</div>
        <a href="#" class="small" data-kmodel="${m.id}">decisions, evidence, incidents →</a></td>
      <td>${pill(m.state, MODEL_STATE_CLASS[m.state])} ${m.pinned ? pill("pinned","info") : ""} ${m.blocked ? pill("blocked","bad") : ""}</td>
      <td>${m.category}</td><td>${p.runtime || "–"} / ${p.device || "–"}</td><td>${p.precision || "–"}</td>
      <td class="num">${fmt.n(p.params_b)}B</td><td class="num">${fmt.mib(p.memory_budget_mb)}</td>
      <td class="num">${p.size ? fmt.bytes(p.size) : "–"}</td><td class="num">${fmt.n(p.context, 0)}</td>
      <td class="num">${s.ttft_ms_p50 !== undefined ? fmt.n(s.ttft_ms_p50, 0) + " ms" : "–"}</td>
      <td class="num">${fmt.n(s.decode_tps_p50)}</td><td class="num">${s.quality !== undefined ? fmt.pct(s.quality) : "–"}</td>
      <td class="small">${(m.aliases || []).join(", ")}</td>
      <td class="small">${m.last_benchmark ? fmt.ago(m.last_benchmark.ts) : "never"}<br><span class="muted">upd ${fmt.ago(m.updated)}</span></td>
      <td class="row" style="min-width:230px">${actionButtons(m)}</td></tr>`;
  });
  return html`<section><h2>Model inventory</h2>${tbl(["Model","State","Category","Runtime","Quant","Params","Mem budget","Disk","Context","TTFT p50","tok/s","Quality","Aliases","Benchmark","Actions"], rows, {empty: "Registry is empty."})}</section>`;
}
function actionButtons(m){
  const b = (act, label, cls) => html`<button type="button" class="btn ${raw(cls || "")}" data-act="${act}" data-id="${m.id}">${label}</button>`;
  const out = [];
  if (m.state === "CANDIDATE") out.push(b("download", "Download"));
  if (["STAGED","APPROVED","STANDBY","PRODUCTION","CANARY"].includes(m.state)) out.push(b("benchmark", "Benchmark"));
  if (["PRODUCTION","STANDBY","APPROVED","CANARY"].includes(m.state)) { out.push(b("load", "Load")); out.push(b("unload", "Unload", "danger")); }
  if (["APPROVED","STANDBY"].includes(m.state)) out.push(b("canary", "Canary"));
  if (["CANARY","APPROVED","STANDBY"].includes(m.state)) out.push(b("promote", "Promote", "primary"));
  out.push(b(m.pinned ? "unpin" : "pin", m.pinned ? "Unpin" : "Pin"));
  out.push(b(m.blocked ? "unblock" : "block", m.blocked ? "Unblock" : "Block", m.blocked ? "" : "danger"));
  if (!["PRODUCTION","CANARY"].includes(m.state)) out.push(b("delete", "Delete", "danger"));
  return out;
}
const CONFIRM = {unload: "Unload this model? Aliases it serves will fall back.", promote: "Promote to production for its alias?",
  delete: "Delete this registry entry? (evidence is lost)", block: "Block this model from serving and download?",
  canary: "Start a canary for this model?", download: "Download the pinned artifact (sha256-verified)?"};
document.getElementById("view").addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (CONFIRM[act] && !window.confirm(CONFIRM[act] + "\n\n" + id)) return;
  b.disabled = true;
  try {
    let res;
    if (act === "delete") res = await api("DELETE", "/v1/models/" + encodeURIComponent(id));
    else if (act === "rollback") res = await api("POST", "/v1/aliases/rollback", {alias: id});
    else if (act === "refresh") res = await api("POST", "/v1/models/refresh", {});
    else if (act === "inspect") { inspectorRec = (cache.recent || [])[Number(id)]; renderInspector(); b.disabled = false; return; }
    else {
      const body = {};
      if ((act === "load" || act === "unload") && e.shiftKey) body.force = true;
      res = await api("POST", "/v1/models/" + encodeURIComponent(id) + "/" + act, body);
    }
    toast(act + ": " + ((res && (res.status || res.deployment || res.note)) || "ok"), "ok");
  } catch(err){ toast(act + " failed: " + err.message, "bad"); }
  b.disabled = false;
  refresh();
});

function funnelHtml(cat, f){
  const steps = [["listed", f.listed], ["listing filter", f.after_listing_filter], ["details", f.detail_fetched],
                 ["deterministic", f.after_deterministic], ["Jev screened", f.after_screening], ["shortlisted", (f.shortlisted || []).length]];
  return html`<div class="card" style="margin-bottom:10px"><h3>${cat}</h3>
    <div class="funnel">${steps.map(([k, v], i) => html`${i ? html`<span class="arrow">→</span>` : ""}<span class="step"><b>${fmt.n(v, 0)}</b> <span class="muted small">${k}</span></span>`)}</div>
    <div class="small muted">Jev calls ${fmt.n(f.jev_calls, 0)} · screening ${fmt.n(f.screen_ms, 0)} ms · providers ${JSON.stringify(f.providers || {})}${f.screen_errors ? " · errors " + f.screen_errors : ""}</div>
    ${Object.keys(f.rejected || {}).length ? html`<div class="small" style="margin-top:6px">Rejected: ${Object.entries(f.rejected).map(([k, v]) => html`<span class="pill neutral" style="margin:2px">${k}: ${v}</span>`)}</div>` : ""}
    ${(f.shortlisted || []).length ? html`<div class="small" style="margin-top:6px">Shortlisted: ${(f.shortlisted).map(s => html`<span class="pill info" style="margin:2px">${s}</span>`)}</div>` : ""}
  </div>`;
}

document.getElementById("view").addEventListener("click", async e => {
  const t = e.target.closest("[data-detab],[data-desel],[data-decompile],[data-deinspect],[data-deact],[data-derun],[data-dehuman]");
  if (!t) return;
  const ds = t.dataset;
  try {
    if (ds.detab !== undefined){ deTab = ds.detab; lsSet("lif.deTab", deTab); }
    else if (ds.desel !== undefined){ deSel = ds.desel; lsSet("lif.deSel", deSel); if (current === "Decision Engineering" && deTab === "Overview"){ deTab = "Questions"; lsSet("lif.deTab", deTab); } }
    else if (ds.derun !== undefined){ deRun = ds.derun; }
    else if (ds.decompile){ deCompiled = await api("POST", "/v1/de/compile", {signature: ds.decompile}); }
    else if (ds.deinspect){ const i = ((cache.deInv || {}).inventory || []).find(x => x.signature === ds.deinspect); if (i) toast(i.signature + ": " + (i.reasons || []).join(" · ") + (i.weaknesses.length ? " · weaknesses " + i.weaknesses.join(",") : ""), "info"); return; }
    else if (ds.dehuman){ await api("POST", "/v1/de/human/" + ds.dehuman, {answer: ds.answer}); toast("Recorded " + ds.answer, "ok"); }
    else if (ds.deact === "test"){ const r = await api("POST", "/v1/de/test", {decision: ds.ref}); toast(ds.ref + ": accuracy " + fmt.pct(r.accuracy) + " on " + r.n, r.accuracy >= 0.9 ? "ok" : "warn"); }
    else if (ds.deact === "calibrate"){ const r = await api("POST", "/v1/de/calibrate", {decision: ds.ref}); toast(ds.ref + ": HIGH " + r.recommended.high + (r.adequacy.adequate ? "" : " (sample not adequate)"), r.adequacy.adequate ? "ok" : "warn"); }
    else if (ds.deact === "promote"){
      const stage = window.prompt("Target stage for " + ds.ref + " (designed, tested, shadow, calibrated, low_risk_automation, expanded_automation, production, retired):", "shadow");
      if (!stage) return;
      const high = ["low_risk_automation","expanded_automation","production"].includes(stage) ? window.prompt("HIGH threshold (must be ≥ the calibrated recommendation):", "") : "";
      const reason = window.prompt("Reason (audited):", "") || "";
      const r = await api("POST", "/v1/de/transition", {ref: ds.ref, stage, reason, policy: high ? {high: Number(high)} : {}});
      toast(r.release.name + "/" + r.release.version + " → " + r.release.stage, "ok");
    }
    else if (ds.deact === "rollback"){ const reason = window.prompt("Rollback reason (audited):", ""); if (reason === null) return; const r = await api("POST", "/v1/de/rollback", {name: ds.ref.split("/")[0], reason}); toast("Serving " + (r.serving || "YAML"), "ok"); }
  } catch(err){ toast(err.message, "bad"); }
  refresh();
});

function kq(params){ return Object.entries(params).filter(([, v]) => v !== undefined && v !== null && v !== "")
  .map(([k, v]) => encodeURIComponent(k) + "=" + encodeURIComponent(v)).join("&"); }
function klink(key, label){ return html`<a href="#" class="mono" data-k="${key}">${label || String(key).split("::").pop()}</a>`; }
function klinks(keys){ return html`${(keys || []).map((k, i) => html`${i ? ", " : ""}${klink(k)}`)}`; }
const K_STATUS = {accepted:"ok", active:"ok", supported:"ok", completed:"ok", resolved:"ok", proposed:"info", open:"info",
  "in-progress":"info", challenged:"warn", contested:"warn", blocked:"warn", invalidated:"bad", superseded:"neutral",
  rejected:"bad", deprecated:"neutral", critical:"bad", high:"warn", normal:"info", low:"neutral"};
function kpill(s){ return s ? pill(s, K_STATUS[s] || "neutral") : ""; }
function kobjRows(objs){
  return objs.map(o => html`<tr><td>${klink(o.key, o.title)}</td><td>${o.type}</td><td>${kpill(o.status)}</td>
    <td class="small muted">${o.repo}</td><td class="small">${o.updated}</td></tr>`);
}

async function kDetail(){
  if (!K.sel) return html``;
  let o;
  try { o = await kapi("GET", "/objects/" + encodeURIComponent(K.sel)); }
  catch(e){ K.sel = null; return html``; }
  const extra = [];
  if (o.type_name === "decision"){
    const w = await kapi("GET", "/why/" + encodeURIComponent(o.key));
    extra.push(card("Why", html`${kv([["Question", w.question || "–"], ["Selected", w.selected || "–"], ["Date", w.date || "–"],
      ["Alternatives", (w.alternatives || []).join(" · ") || "–"]])}
      <h3 style="margin-top:10px">Evidence</h3><div>${klinks(w.evidence.map(e => e.key))}</div>
      <h3>Assumptions</h3><div>${w.assumptions.map(a => html`<div>${klink(a.key)} ${kpill(a.status)}
        <span class="small muted">supports ${(a.support || {}).supports ? a.support.supports.length : 0} · contradicts ${(a.support || {}).contradicts ? a.support.contradicts.length : 0}</span></div>`)}</div>
      <h3>Affects</h3><div>${klinks((w.affects || []).filter(Boolean).map(a => a.key))}</div>
      ${w.reconsiderations.length ? html`<h3>Reconsideration</h3>${w.reconsiderations.map(r => html`<div>${kpill(r.resolved_by ? "resolved" : "open")} ${r.reason}</div>`)}` : ""}`));
  }
  if (["claim", "assumption"].includes(o.type_name)){
    const t = await kapi("GET", "/evidence/" + encodeURIComponent(o.key));
    extra.push(card("Evidence", html`${t.groundings.length ? t.groundings.map(g => html`<div style="margin-bottom:8px">
      ${kpill(g.stance === "supports" ? "supported" : g.stance === "contradicts" ? "contested" : g.stance)} ${g.evidence ? klink(g.evidence.key, g.evidence.title) : "?"}
      <span class="small muted">basis ${g.basis || "?"} · quality ${g.evidence_quality || "?"}</span>
      ${g.passage ? html`<div class="small">“${g.passage.text}”</div>` : ""}</div>`) : html`<div class="muted">No groundings — unverified.</div>`}
      ${t.independence_warning ? html`<div>${pill("shared dataset", "warn")} groundings are not independent</div>` : ""}
      <div class="small muted">${t.verdict}</div>`));
  }
  const imp = await kapi("GET", "/impact/" + encodeURIComponent(o.key));
  extra.push(card("Change impact", Object.keys(imp.by_type).length ? html`${Object.entries(imp.by_type).map(([t, xs]) =>
    html`<div><b>${t}</b> (${xs.length}): ${klinks(xs.map(x => x.key))}</div>`)}` : html`<div class="muted">Nothing depends on it.</div>`));
  const p = o.provenance || {};
  return html`<section class="card" style="margin-bottom:14px">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">${o.title} ${kpill(o.status)}</h2>
      <button type="button" class="btn" data-kclose="1">Close</button></div>
    <div class="small muted mono">${o.key} · ${o.type} · ${p.repo}@${p.repo_version} · ${String(p.path || "").split("/").slice(-3).join("/")}:${p.line} · updated ${p.updated} ${p.updated_by ? "by " + p.updated_by : ""}</div>
    ${o.body && o.body.trim() ? html`<p style="white-space:pre-wrap">${o.body.trim().slice(0, 1500)}</p>` : ""}
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-top:10px">
      ${card("Links out", html`${o.links_out.length ? o.links_out.map(l => html`<div><span class="muted small">${l.field || l.rel}</span> ${l.resolved ? klink(l.target) : html`<span class="pill bad">${l.target}</span>`}</div>`) : html`<div class="muted">none</div>`}`)}
      ${card("Links in", html`${o.links_in.length ? o.links_in.map(l => html`<div><span class="muted small">${l.field || l.rel} of</span> ${klink(l.source)}</div>`) : html`<div class="muted">none</div>`}`)}
      ${extra}
      ${o.diagnostics.length ? card("Diagnostics", html`${o.diagnostics.map(d => html`<div>${kpill(d.severity === "error" ? "invalidated" : "challenged")} ${d.code} ${d.message}</div>`)}`) : ""}
    </div></section>`;
}

async function pageKnowledge(){
  const [h, res, recent] = await Promise.all([kapi("GET", "/health"),
    K.q ? kapi("GET", "/search?" + kq({q: K.q, type: K.type, limit: 30})) : Promise.resolve(null),
    kapi("GET", "/objects?" + kq({type: "decision,assumption,lesson,incident,task,question", limit: 15}))]);
  const pct = v => v === null || v === undefined ? "–" : fmt.pct(v);
  return html`${await kDetail()}
  <div class="grid">
    ${card("Knowledge health", kv([["Objects", fmt.n(h.objects, 0)], ["Valid references", pct(h.valid_reference_rate)],
      ["Broken references", fmt.n(h.broken_references, 0)], ["Errors / warnings", h.errors + " / " + h.warnings]]))}
    ${card("Decisions", kv([["Decisions", fmt.n(h.decisions, 0)], ["Traceable to evidence", pct(h.decision_traceability_rate)],
      ["Needing review", fmt.n(h.decisions_needing_review, 0)], ["Reconsideration queue", fmt.n(h.reconsideration_queue, 0)]]))}
    ${card("Claims & assumptions", kv([["Evidence coverage", pct(h.evidence_coverage)], ["Stale / challenged assumptions", fmt.n(h.stale_assumptions, 0)],
      ["Conflicting claims", fmt.n(h.conflicting_claims, 0)], ["Orphans", fmt.n(h.orphans, 0)]]))}
    ${card("Work", kv([["Open tasks", fmt.n(h.open_tasks, 0)], ["Open questions", fmt.n(h.open_questions, 0)],
      ["Sessions", fmt.n(h.sessions, 0)], ["Context recovery rate", pct(h.context_recovery_rate)]]))}
  </div>
  <section style="margin-top:14px"><h2>Search</h2>
    <form id="ksearch" class="row"><input type="text" id="kq" placeholder="search objects, decisions, evidence, skills…" value="${K.q}" style="min-width:320px">
      <input type="text" id="ktype" placeholder="type (optional)" value="${K.type}" style="width:150px"><button class="btn" type="submit">Search</button></form>
    ${res ? html`<p class="small muted">retrieval: ${res.retrieval.join(" + ")} · ${res.total} match(es)</p>
      ${tbl(["Object", "Type", "Status", "Repo", "Score", "Snippet"], res.results.map(r => html`<tr><td>${klink(r.key, r.title)}</td><td>${r.type}</td>
        <td>${kpill(r.status)}</td><td class="small muted">${r.repo}</td><td class="num">${r.score}</td><td class="small">${(r.snippet || "").slice(0, 120)}</td></tr>`))}` : ""}
  </section>
  <section><h2>Recently changed</h2>${tbl(["Object", "Type", "Status", "Repo", "Updated"], kobjRows(recent), {empty: "No knowledge yet."})}</section>`;
}

async function pageKDecisions(){
  const ds = await kapi("GET", "/objects?type=decision");
  return html`${await kDetail()}<section><h2>Decisions <span class="muted small">— click one for evidence, assumptions, alternatives, downstream impact and reconsideration status</span></h2>
    ${tbl(["Decision", "Status", "Date", "Selected", "Evidence", "Assumptions"], ds.map(d => html`<tr><td>${klink(d.key, d.title)}</td><td>${kpill(d.status)}</td>
      <td class="small">${d.fields.date || ""}</td><td class="small">${String(d.fields.selected || "").slice(0, 80)}</td>
      <td class="small">${(d.fields.evidence || []).length}</td><td class="small">${(d.fields.assumptions || []).length}</td></tr>`), {empty: "No decisions recorded."})}</section>`;
}

async function pageKEvidence(){
  const [as, cs] = await Promise.all([kapi("GET", "/objects?type=assumption"), kapi("GET", "/objects?" + kq({type: "claim", limit: 200}))]);
  const claims = cs.filter(c => c.type === "claim");
  return html`${await kDetail()}<section><h2>Assumptions <span class="muted small">— an invalidated or contradicted assumption queues everything that rests on it for review</span></h2>
    ${tbl(["Assumption", "Status", "Confidence", "Updated"], as.map(a => html`<tr><td>${klink(a.key, a.title)}</td><td>${kpill(a.status)}</td>
      <td>${a.fields.confidence || "–"}</td><td class="small">${a.updated}</td></tr>`), {empty: "No assumptions."})}</section>
    <section><h2>Claims <span class="muted small">— groundings record what sources say; they do not make a claim true</span></h2>
    ${tbl(["Claim", "Status", "Confidence", "Repo"], claims.map(c => html`<tr><td>${klink(c.key, c.title)}</td><td>${kpill(c.status)}</td>
      <td>${c.fields.confidence || "–"}</td><td class="small muted">${c.repo}</td></tr>`), {empty: "No claims."})}</section>`;
}

async function pageKReconsider(){
  const rs = await kapi("GET", "/reconsiderations");
  return html`${await kDetail()}<section><h2>Reconsideration queue <span class="muted small">— never auto-reversed; record a review (reaffirmed / revised / superseded) to close an item</span></h2>
    ${tbl(["Object", "Priority", "Because", "Trigger", "Path", "Since", ""], rs.map(r => html`<tr><td>${klink(r.key)}</td><td>${kpill(r.priority)}</td>
      <td class="small">${r.reason}</td><td>${klink(r.trigger)}</td><td class="small mono">${r.chain.filter((_, i) => i % 2 === 0).map(k => k.split("::").pop()).join(" → ")}</td>
      <td class="small">${r.since}</td><td class="row"><button type="button" class="btn" data-kreview="${r.key}" data-ktrigger="${r.trigger}" data-koutcome="reaffirmed">Reaffirm</button>
      <button type="button" class="btn" data-kreview="${r.key}" data-ktrigger="${r.trigger}" data-koutcome="needs-work">Needs work</button></td></tr>`),
      {empty: "Nothing needs reconsideration."})}</section>`;
}

async function pageKDiagnostics(){
  const ds = await kapi("GET", "/diagnostics");
  return html`<section><h2>Knowledge diagnostics <span class="muted small">— the compiler's view: types, references, staleness, contradictions, missing evidence</span></h2>
    ${tbl(["Severity", "Code", "Object", "Message", "File"], ds.map(d => html`<tr><td>${kpill(d.severity === "error" ? "invalidated" : d.severity === "warning" ? "challenged" : "open")} ${d.severity}</td>
      <td class="mono">${d.code}</td><td>${d.key ? klink(d.key) : ""}</td><td class="small">${d.message}</td>
      <td class="small mono">${String(d.path || "").split("/").slice(-2).join("/")}${d.line ? ":" + d.line : ""}</td></tr>`), {empty: "No diagnostics."})}</section>`;
}

async function pageKCapabilities(){
  const [sk, pk, vw] = await Promise.all([kapi("GET", "/skills"), kapi("GET", "/packages"), kapi("GET", "/views")]);
  return html`<section><h2>Skills</h2>${tbl(["Skill", "Version", "From", "Description", "Checks / tests"], sk.map(s => html`<tr><td class="mono">${s.name}</td>
      <td class="num">${s.version}</td><td class="small">${s.repo}@${s.repo_version}</td><td class="small">${s.description}</td>
      <td class="small">${s.has_checks ? "checks" : "–"} ${s.has_tests ? "· tests" : ""}</td></tr>`))}</section>
    <section><h2>Packages <span class="muted small">— local registry; installs and upgrades need a human (knowledge package …)</span></h2>
      ${tbl(["Package", "Versions", "Description"], pk.map(p => html`<tr><td class="mono">${p.name}</td><td class="small">${p.versions.join(", ")}</td><td class="small">${p.description}</td></tr>`))}</section>
    <section><h2>Views and apps</h2>${tbl(["View", "Kind", "From", "Title"], vw.views.map(v => html`<tr><td class="mono">${v.name}</td><td>${v.kind}</td><td class="small">${v.repo}</td><td class="small">${v.title}</td></tr>`))}
      <div class="grid" style="margin-top:10px">${vw.apps.map(a => card(a.title || a.name, html`<div class="small">${a.description}</div><div class="small muted mono">${a.views.join(" · ")}</div>`))}</div></section>`;
}

async function pageKWork(){
  const [tasks, sessions, qs] = await Promise.all([kapi("GET", "/objects?type=task"), kapi("GET", "/objects?type=session&limit=20"),
    kapi("GET", "/objects?type=question&status=open")]);
  const lanes = ["open", "in-progress", "blocked", "completed"];
  return html`${await kDetail()}<section><h2>Agent work</h2><div class="grid" style="grid-template-columns:repeat(4,minmax(180px,1fr))">
    ${lanes.map(l => card(l, html`${tasks.filter(t => t.status === l).map(t => html`<div>${klink(t.key, t.title)}</div>`)}`))}</div></section>
    <section><h2>Sessions <span class="muted small">— checkpoints the next session resumes from (knowledge session resume)</span></h2>
    ${tbl(["Session", "Agent", "Ended", "Next"], sessions.map(s => html`<tr><td>${klink(s.key, s.title)}</td><td class="small">${s.fields.agent || ""}</td>
      <td class="small">${s.fields.ended || ""}</td><td class="small">${(s.fields.next || []).join(" · ")}</td></tr>`), {empty: "No sessions checkpointed yet."})}</section>
    <section><h2>Open questions</h2>${tbl(["Question", "Status", "Repo", "Updated"], qs.map(q => html`<tr><td>${klink(q.key, q.title)}</td><td>${kpill(q.status)}</td><td class="small muted">${q.repo}</td><td class="small">${q.updated}</td></tr>`))}</section>`;
}

document.getElementById("view").addEventListener("click", async e => {
  const a = e.target.closest("[data-k],[data-kclose],[data-kreview],[data-kmodel]");
  if (!a) return;
  e.preventDefault();
  if (a.dataset.kmodel){ K.q = a.dataset.kmodel; K.type = ""; current = "Knowledge"; lsSet("lif.page", current); navRender(); }
  else if (a.dataset.kclose){ K.sel = null; lsSet("lif.k.sel", null); }
  else if (a.dataset.kreview){
    try { await kapi("POST", "/reviews", {object: a.dataset.kreview, trigger: a.dataset.ktrigger, outcome: a.dataset.koutcome});
          toast("review recorded", "ok"); } catch(err){ toast(err.message, "bad"); }
  } else { K.sel = a.dataset.k; lsSet("lif.k.sel", K.sel); }
  refresh();
  if (K.sel) window.scrollTo(0, 0);
});
document.getElementById("view").addEventListener("submit", e => {
  if (e.target.id !== "ksearch") return;
  e.preventDefault();
  K.q = document.getElementById("kq").value.trim(); K.type = document.getElementById("ktype").value.trim();
  refresh();
});
function kTyping(){ const a = document.activeElement; return !!(a && a.closest && a.closest("#view") && a.tagName === "INPUT"); }

const RENDER = {"Overview": pageOverview, "Models": pageModels, "Discovery": pageDiscovery, "Deployments": pageDeployments,
  "Inference": pageInference, "Decision Fabric": pageDecision, "Batch Jobs": pageBatch, "GPU": pageGpu,
  "Benchmarks": pageBenchmarks, "Registry": pageRegistry, "Savings": pageSavings, "Settings": pageSettings,
  "Decision Engineering": pageDE,
  "Knowledge": pageKnowledge, "Decisions": pageKDecisions, "Evidence": pageKEvidence, "Reconsiderations": pageKReconsider,
  "Diagnostics": pageKDiagnostics, "Agent Work": pageKWork, "Skills & Packages": pageKCapabilities};

let busy = false;
async function refresh(){
  if (busy) return;
  busy = true;
  document.getElementById("title").textContent = current;
  try {
    const out = await RENDER[current]();
    setHTML(document.getElementById("view"), out);
    if (cache.overview) headerState(cache.overview);
    else api("GET", "/v1/gpu").then(g => headerState({blerbz: g})).catch(() => {});
    document.getElementById("lastRefresh").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch(err){
    setHTML(document.getElementById("view"), html`<div class="card"><b>Could not load ${current}.</b><p class="small">${err.message}</p></div>`);
  }
  busy = false;
}

document.getElementById("signout").onclick = () => { KEY = null; lsSet("lif.adminKey", null); setHTML(document.getElementById("view"), html`<div class="empty">Signed out. Reload to sign in.</div>`); };
document.getElementById("themeBtn").onclick = () => {
  const r = document.documentElement; const cur = r.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : (cur === "light" ? "" : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark"));
  if (next) r.setAttribute("data-theme", next); else r.removeAttribute("data-theme");
  lsSet("lif.theme", next || null);
};
(function(){ const t = lsGet("lif.theme"); if (t) document.documentElement.setAttribute("data-theme", t); })();
document.addEventListener("keydown", e => { if (e.key === "Escape" && inspectorRec){ inspectorRec = null; renderInspector(); } });

navRender();
refresh();
setInterval(() => { if (!document.hidden && !inspectorRec && !kTyping()) refresh(); }, 10000);
</script>
</body>
</html>
