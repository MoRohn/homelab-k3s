[package]
name = "labzilla-tray"
version = "0.1.0"
description = "Labzilla in the system tray / menu bar: quick Ask and the full console"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "labzilla_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-positioner = { version = "=2.4.0", features = ["tray-icon"] }
tauri-plugin-opener = "=2.7.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
