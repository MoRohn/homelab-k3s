name: ai-infrastructure-core
version: 1.0.0
kind: package
data_class: PUBLIC              # published in the public repo
description: >
  Infrastructure as knowledge: services, deployments, models, runtimes, benchmarks and hosts, so an
  agent can see why the runtime looks the way it does (model → deployment → decision → benchmark).
dependencies:
  - {name: knowledge-governance, version: ^1.0}
  - {name: agent-workflows, version: ^1.0}
exports:
  types: [service, deployment, model, runtime, benchmark, host]
  skills: [deploy-service, review-change, benchmark-model, analyze-failure]
  views: [system-map, deployment-lineage, decision-history]
  methods: [knowledge-aware-change]
