# tier0: CPU-only llama.cpp serving profile qwen3-4b-instruct-2507-q4km-cpu.
# No runtimeClassName / NVIDIA_VISIBLE_DEVICES on purpose: this pod must never create a
# CUDA context (gpusched would flag it as an unmanaged GPU consumer). Weights are mmap'd
# from the model store, so they live in reclaimable page cache charged to this pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tier0
  namespace: ai-serving
  labels: {app: tier0, lif.dev/profile: qwen3-4b-instruct-2507-q4km-cpu, lif.dev/tier: cpu}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: tier0}}
  template:
    metadata:
      labels: {app: tier0, lif.dev/profile: qwen3-4b-instruct-2507-q4km-cpu, lif.dev/role: model-server}
    spec:
      priorityClassName: ai-critical
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp@sha256:6d607629e3dd5e85f45c43d1494648126cb3f93f2122c9cd53f43242c94cde14
          command: ["/app/llama-server"]
          args:
            - "--model"
            - "/models/unsloth/Qwen3-4B-Instruct-2507-GGUF/a06e946bb6b655725eafa393f4a9745d460374c9/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--threads"
            - "10"
            - "--threads-batch"
            - "10"
            - "--cpu-mask"
            - "7C1F"
            - "--cpu-strict"
            - "1"
            - "--metrics"
            # Keep quantized weights file-backed (reclaimable page cache). Repacking copies them
            # into anonymous memory (+3 GB measured for the 4B model) on this memory-saturated host.
            - "--no-repack"
            # Lock the weights in RAM so host-wide reclaim can't evict them mid-answer (they would be re-read
            # at once while tier0 serves). Needs homelab/host/prep-memlock.sh; until then llama.cpp only warns.
            # (This build has no --mlock flag: it exits on it.)
            - "--load-mode"
            - "mmap+mlock"
            - "--no-webui"
            - "--ctx-size"
            - "8192"
            - "--parallel"
            - "2"              # measured: 4-way batching lowers CPU throughput
            - "--cache-type-k"
            - "q8_0"
            - "--cache-type-v"
            - "q8_0"
            - "--flash-attn"
            - "on"
            - "--jinja"
            - "--cache-ram"      # host-RAM prompt cache: llama.cpp defaults to 8 GiB of anon memory
            - "256"
            - "--cache-reuse"    # keep the cached prefix when the console drops the oldest turn
            - "256"
          ports: [{name: http, containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources:
            # weights (2,381 MiB, page cache charged here) + anon (measured 1,409 MiB + 256 MiB prompt cache)
            # + 15 % (hardware_fit). 3584Mi made the cgroup evict weights every token (2026-10-01).
            requests: {cpu: 500m, memory: 4864Mi}
            limits: {cpu: "8", memory: 4864Mi}
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 30, timeoutSeconds: 10, failureThreshold: 4}
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: models, persistentVolumeClaim: {claimName: model-store, readOnly: true}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: tier0, namespace: ai-serving, labels: {app: tier0, lif.dev/role: model-server}}
spec:
  selector: {app: tier0}
  ports: [{name: http, port: 8080, targetPort: http}]
