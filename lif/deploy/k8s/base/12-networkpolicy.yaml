# Ingress isolation (K3s enforces NetworkPolicy via its embedded kube-router).
# Raw model servers are reachable ONLY from LIF services and Prometheus — never from the LAN.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: model-servers, namespace: ai-serving}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ai-system}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: internal-services, namespace: ai-system}
spec:
  # console → batch: per-job pause/resume/cancel (batch has no app-level auth; the console enforces its own)
  podSelector:
    matchExpressions: [{key: app, operator: In, values: [decision-fabric, batch]}]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchExpressions: [{key: app, operator: In, values: [gateway, controller, batch, console]}]}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
---
# gateway + controller: reachable in-cluster and from Traefik (LAN ingress, auth enforced by the apps)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: edge-services, namespace: ai-system}
spec:
  podSelector:
    matchExpressions: [{key: app, operator: In, values: [gateway, controller]}]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ai-system}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ai-batch}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}   # traefik
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
        - ipBlock: {cidr: 10.42.0.1/32}       # host (cni0): primary-workload processes, kubelet probes, local CLI
---
# earn (the arbies earning system, namespace earn): only its runtime pod, only the gateway. It authenticates
# with its own `earn` key in LIF_GATEWAY_KEYS (scripts/create-secrets.sh); the controller stays closed to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: earn-gateway, namespace: ai-system}
spec:
  podSelector: {matchLabels: {app: gateway}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: earn}}
          podSelector: {matchLabels: {app: earn}}
      ports: [{port: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: registry-local-only, namespace: ai-system}
spec:
  podSelector: {matchLabels: {app: registry}}
  policyTypes: [Ingress]
  ingress:
    - from: [{ipBlock: {cidr: 10.42.0.1/32}}]   # node-local pushes/pulls via hostPort 127.0.0.1:5000
---
# console: only Traefik (LAN ingress), Prometheus (scrapes /metrics) and the host (kubelet probes).
# The console believes X-Forwarded-For/-Proto from pod-network peers (console.trusted_proxies), so no
# other pod may connect: one that could would pick its own client address for the rate limits.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: console-ingress, namespace: ai-system}
spec:
  podSelector: {matchLabels: {app: console}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
        - ipBlock: {cidr: 10.42.0.1/32}       # host (cni0): kubelet probes
