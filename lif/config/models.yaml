# Logical aliases → deployment profiles → pinned physical models.
# Applications only ever name an alias (local/fast, local/default, ...). The registry
# (controller) owns the live mapping. This file is the bootstrap seed, and it is also
# the gateway's last-known-good fallback if the controller is unreachable.

profiles:
  qwen3-4b-instruct-2507-q4km-cpu:
    category: general
    runtime: llama.cpp
    device: cpu
    hf_repo: unsloth/Qwen3-4B-Instruct-2507-GGUF
    revision: a06e946bb6b655725eafa393f4a9745d460374c9
    file: Qwen3-4B-Instruct-2507-Q4_K_M.gguf
    sha256_prefix: 3605803b982cb64a
    precision: q4_k_m
    params_b: 4.0
    context: 8192
    concurrency: 2              # measured: 4-way batching lowers CPU throughput (bandwidth-bound)
    memory_budget_mb: 3584        # mmap'd weights (page cache, charged to the pod) + KV + buffers
    endpoint: http://tier0.ai-serving.svc:8080
    license: apache-2.0

  qwen3-1.7b-q8-cpu:
    category: fast
    runtime: llama.cpp
    device: cpu
    hf_repo: Qwen/Qwen3-1.7B-GGUF
    revision: 90862c4b9d2787eaed51d12237eafdfe7c5f6077
