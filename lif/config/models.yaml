# Alias → ordered candidates. The router serves the first HEALTHY candidate and
# reports any fallback in the response (`lif` metadata). An alias with no healthy
# candidate returns 503 with a reason — never a silent substitution outside its chain.
aliases:
  local/instant:   [qwen3-1.7b-q8-cpu, qwen3-4b-instruct-2507-q4km-cpu]
  local/fast:      [qwen3-4b-instruct-2507-q4km-cpu, qwen3-1.7b-q8-cpu]
  local/default:   [qwen3-4b-instruct-2507-q4km-cpu, qwen3-1.7b-q8-cpu]
  local/reasoning: [qwen3-4b-instruct-2507-q4km-cpu]
  local/code:      [qwen3-4b-instruct-2507-q4km-cpu]
  local/batch:     [qwen3-4b-instruct-2507-q4km-cpu, qwen3-1.7b-q8-cpu]
  local/embedding: [qwen3-embedding-0.6b-q8-cpu]
  # local/vision is filled by Check for Better Models (category "vision": a CPU-sized GGUF plus a
  # sha-pinned *mmproj*.gguf image projector), then download → vision benchmark → promote. Until a
  # model is promoted the alias exists so callers get a clear 503 ("no vision model is installed
  # yet") rather than an unknown-model 404. No local reranker is deployed yet either.
  local/vision:    []
  local/rerank:    []

# Quality tier per alias. Used to label degraded service (e.g. local/default served by
# a 1.7B model is marked `degraded: true`).
alias_min_params_b:
  local/default: 4.0
  local/reasoning: 30.0
  local/code: 14.0
  local/vision: 1.5      # 2B-class VLMs (Qwen3-VL-2B = 1.72B) are full service; smaller ones are labelled degraded
